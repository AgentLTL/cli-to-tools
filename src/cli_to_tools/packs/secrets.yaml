# secrets – tools that decrypt, store or pass credentials: decryption, password managers,
# keychains, key inspection, database clients. See shell.yaml for the schema.

sops:
  options:
    - {flags: [-d, --decrypt], type: bool}
    - {flags: [-e, --encrypt], type: bool}
    - {flags: [-i, --in-place], dest: in_place, type: bool}
    - {flags: [--output]}
    - {flags: [--extract]}
  positionals: [{name: files, nargs: "*"}]

ansible-vault:
  options:
    - {flags: [--vault-password-file, --vault-pass-file], dest: vault_password_file, global: true}
    - {flags: [--vault-id], global: true}
  subcommands:
    view: {positionals: [{name: files, nargs: "*"}]}
    decrypt: {options: [{flags: [--output]}], positionals: [{name: files, nargs: "*"}]}
    encrypt: {options: [{flags: [--output]}], positionals: [{name: files, nargs: "*"}]}
    edit: {positionals: [{name: files, nargs: "*"}]}
    encrypt_string: {options: [{flags: [-n, --name]}], positionals: [{name: value, nargs: "?"}]}

gpg:
  aliases: [gpg2]
  options:
    - {flags: [-d, --decrypt], type: bool}
    - {flags: [-e, --encrypt], type: bool}
    - {flags: [-o, --output]}
    - {flags: [-r, --recipient], type: list}
    - {flags: [--export-secret-keys], dest: export_secret_keys, type: bool}
    - {flags: [--export-secret-subkeys], dest: export_secret_subkeys, type: bool}
    - {flags: [-a, --armor], type: bool}
    - {flags: [--batch], type: bool}
    - {flags: [--passphrase]}
  positionals: [{name: files, nargs: "*"}]

age:
  options:
    - {flags: [-d, --decrypt], type: bool}
    - {flags: [-i, --identity], type: list}
    - {flags: [-o, --output]}
    - {flags: [-r, --recipient], type: list}
    - {flags: [-p, --passphrase], type: bool}
  positionals: [{name: files, nargs: "*"}]

op:
  options:
    - {flags: [--account], global: true}
  subcommands:
    read: {options: [{flags: [-o, --out-file]}], positionals: [{name: reference}]}
    item:
      subcommands:
        get:
          options: [{flags: [--fields]}, {flags: [--reveal], type: bool}, {flags: [--vault]}, {flags: [--format]}]
          positionals: [{name: item}]
        list: {options: [{flags: [--vault]}]}
    inject: {options: [{flags: [-i, --in-file]}, {flags: [-o, --out-file]}]}
    run: {posix: true, positionals: [{name: command, nargs: "*"}]}
    signin: {}

bw:
  subcommands:
    get: {positionals: [{name: object}, {name: id}]}
    list: {positionals: [{name: object}]}
    unlock: {options: [{flags: [--raw], type: bool}, {flags: [--passwordenv]}, {flags: [--passwordfile]}]}
    export: {options: [{flags: [--output]}, {flags: [--format]}]}

pass:
  subcommands:
    show: {options: [{flags: [-c, --clip], type: bool}], positionals: [{name: name}]}
    ls: {positionals: [{name: subfolder, nargs: "?"}]}
    insert: {options: [{flags: [-m, --multiline], type: bool}], positionals: [{name: name}]}
    generate: {positionals: [{name: name}, {name: length, nargs: "?"}]}
    edit: {positionals: [{name: name}]}
    rm: {positionals: [{name: name}]}

security:
  subcommands:
    find-generic-password: &keychain_find
      options:
        - {flags: [-w], dest: print_password, type: bool, help: "Print only the password"}
        - {flags: [-g], dest: show_password, type: bool}
        - {flags: [-s], dest: service}
        - {flags: [-a], dest: account}
      positionals: [{name: keychain, nargs: "?"}]
    find-internet-password: *keychain_find
    dump-keychain: {options: [{flags: [-d], dest: decrypt, type: bool}], positionals: [{name: keychain, nargs: "?"}]}

secret-tool:
  subcommands:
    lookup: {positionals: [{name: attributes, nargs: "*"}]}
    search: {options: [{flags: [--all], type: bool}, {flags: [--unlock], type: bool}], positionals: [{name: attributes, nargs: "*"}]}
    store: {options: [{flags: [--label]}], positionals: [{name: attributes, nargs: "*"}]}

openssl:
  subcommands:
    rsa: &openssl_key
      options:
        - {flags: [-in], dest: input}
        - {flags: [-out], dest: output}
        - {flags: [-text], type: bool}
        - {flags: [-noout], type: bool}
        - {flags: [-passin]}
        - {flags: [-pubout], type: bool}
    pkey: *openssl_key
    ec: *openssl_key
    pkcs12:
      options:
        - {flags: [-in], dest: input}
        - {flags: [-out], dest: output}
        - {flags: [-nodes], type: bool, help: "Writes the private key unencrypted"}
        - {flags: [-passin]}
        - {flags: [-export], type: bool}
    x509:
      options: [{flags: [-in], dest: input}, {flags: [-text], type: bool}, {flags: [-noout], type: bool}]
    enc:
      options:
        - {flags: [-d], dest: decrypt, type: bool}
        - {flags: [-in], dest: input}
        - {flags: [-out], dest: output}
        - {flags: [-k], dest: password}
        - {flags: [-pass]}
    rand: {options: [{flags: [-hex], type: bool}, {flags: [-base64], type: bool}], positionals: [{name: bytes}]}

mysql:
  aliases: [mariadb]
  options:
    - {flags: [-u, --user]}
    - {flags: [-p, --password], type: attached, help: "-pSECRET puts the password on the command line"}
    - {flags: [-h, --host]}
    - {flags: [-P, --port]}
    - {flags: [-D, --database]}
    - {flags: [-e, --execute]}
  positionals: [{name: database, nargs: "?"}]

psql:
  options:
    - {flags: [-U, --username]}
    - {flags: [-h, --host]}
    - {flags: [-p, --port]}
    - {flags: [-d, --dbname]}
    - {flags: [-c, --command], type: list}
    - {flags: [-f, --file]}
    - {flags: [-W, --password], type: bool}
  positionals: [{name: database, nargs: "?"}, {name: user, nargs: "?"}]

redis-cli:
  options:
    - {flags: [-a], dest: password}
    - {flags: [-u], dest: uri}
    - {flags: [-h], dest: host}
    - {flags: [-p], dest: port}
    - {flags: [--user]}
    - {flags: [--pass], dest: password}
  positionals: [{name: command, nargs: "*"}]
